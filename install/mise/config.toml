[tools]
actionlint = "latest"
bun = "latest"
dotnet = "latest"
gitleaks = "latest"
go = "latest"
helm = "latest"
java = "latest"
jq = "latest"
kubectl = "latest"
markdownlint-cli2 = "latest"
node = "26"
pipx = "latest"
pnpm = "latest"
pre-commit = "latest"
prettier = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
shellcheck = "latest"
terraform = "latest"
yamllint = "latest"
yarn = "latest"
yq = "latest"
bitwarden-secrets-manager = "latest"
buf = "latest"
"github:SigNoz/foundry" = "0.2.17"
"github:SigNoz/signoz-mcp-server" = "0.14.0"

# Community SigNoz Docker (UI :8080, OTLP :4318). GUI Cursor from Dock does not inherit this.
# SIGNOZ_API_KEY stays in ~/.secrets (never commit).
[env]
SIGNOZ_URL = "http://localhost:8080"
CLAUDE_CODE_ENABLE_TELEMETRY = "1"
OTEL_METRICS_EXPORTER = "otlp"
OTEL_LOGS_EXPORTER = "otlp"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"

